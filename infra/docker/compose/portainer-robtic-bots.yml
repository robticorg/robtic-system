# Production stack `robtic-bots` — deployed by Portainer from this file, redeployed by its stack
# webhook after every image push. Images only: nothing is built here. Each repository's
# .github/workflows/deploy*.yml pushes `:production` and an immutable `:sha-<commit>` tag.
#
# Settings live in the admin console's Vault (admin.robtic.org → Vault): one app per bot (robtic-system,
# robtic-staff, robtic-ticket, robtic-engine, robtic-guard, robtic-minecraft) holds its tokens, databases and tuning.
# The Portainer stack keeps only each app's access key (ROBTIC_*_VAULT_KEY). Every container starts through
# /vault/vault-run (installed on the host by robtic-admin's infra/vault), which loads its app's settings first; the
# values written here are wiring that belongs to this file (roles, ports, internal addresses), not settings.
#
# Networks:
#   proxy   — Nginx Proxy Manager, created outside this stack. Only HTTP APIs reached from outside
#             the host join it.
#   internal (this stack) — service-to-service calls and outbound internet (Discord).
# MongoDB and Redis run on the database VM (192.168.1.120) and are reached by LAN IP.
# The HTTP APIs publish the same host ports the old server did (8788 staff points,
# 3002 Minecraft, 8787 guard), so callers on the LAN keep working. Services inside this stack still
# call each other by container name over `internal`.

name: robtic-bots

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# What every robtic-system container shares. The image runs several roles: the Gateway (default
# CMD), the queue workers and the Invites API — the same code with a different start command.
# The Vault (robtic-system) holds MONGODB_URI, REDIS_URL (required, never empty: without it each Gateway skips the
# leadership lock and the primary and standby would both log in), INTERNAL_API_TOKEN, BOT_OWNER_ID,
# STAFF_POINTS_API_TOKEN and the admin console's bot-settings database (ROBTIC_CONFIG_MONGO_URI, ROBTIC_CONFIG_KEY).
x-vault: &vault
  entrypoint: ["/vault/vault-run", "/usr/local/bin/docker-entrypoint.sh"]
  volumes:
    - /opt/robtic/vault/vault-run:/vault/vault-run:ro

x-robtic-system-env: &robtic-system-env
  NODE_ENV: production
  ROBTIC_BOT: system
  ROBTIC_VAULT_KEY: ${ROBTIC_SYSTEM_VAULT_KEY:?ROBTIC_SYSTEM_VAULT_KEY is required (admin.robtic.org → Vault → robtic-system)}
  # Staff points API (robtic-staff), by container name over `internal`.
  STAFF_POINTS_API_URL: http://robtic-staff:8788
  # Robtic Bot Log (robticorg/robtic-bot-log): joins/leaves; the key is ROBTIC_BOT_LOG_KEY in this bot's Vault app.
  ROBTIC_BOT_LOG_URL: http://robtic-bot-log:3400

x-robtic-system-gateway: &robtic-system-gateway
  <<: *vault
  image: ghcr.io/robticorg/robtic-system:${ROBTIC_SYSTEM_IMAGE_TAG:-production}
  command: ["bun", "--preload", "./libs/shared/src/preload.ts", "apps/bot/src/index.ts"]
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *logging
  networks: [internal]
  healthcheck:
    test: ["CMD", "bun", "-e", "const t=Number(await Bun.file('/tmp/gateway-health').text().catch(()=>0));process.exit(Date.now()-t<60000?0:1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

x-robtic-system-gateway-env: &robtic-system-gateway-env
  <<: *robtic-system-env
  # MainBotToken and MUSIC_TOKEN_KEY come from the admin console (Bot settings → Robtic System) only.
  INVITES_API_URL: http://robtic-invites-api:3005

x-robtic-system-worker: &robtic-system-worker
  <<: *vault
  image: ghcr.io/robticorg/robtic-system:${ROBTIC_SYSTEM_IMAGE_TAG:-production}
  command: ["bun", "--preload", "./libs/shared/src/preload.ts", "apps/worker/src/index.ts"]
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *logging
  environment:
    <<: *robtic-system-env
  networks: [internal]
  healthcheck:
    test: ["CMD", "bun", "-e", "const t=Number(await Bun.file('/tmp/worker-health').text().catch(()=>0));process.exit(Date.now()-t<60000?0:1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # The Gateway (apps/bot) — the primary. Only one Gateway is logged in to Discord at a time (the
  # Redis lock in apps/bot/src/services/gateway-leadership); robtic-system-standby takes over
  # within ~15s if this one dies, hangs or loses Discord.
  # Slash commands are published by whichever Gateway leads, every time it starts.
  robtic-system:
    <<: *robtic-system-gateway
    container_name: robtic-system
    environment:
      <<: *robtic-system-gateway-env
      GATEWAY_ROLE: primary
    # Started, not healthy: the Gateway must never be held back by an internal service.
    depends_on:
      robtic-invites-api:
        condition: service_started

  # Standby Gateway: same image, waits (not logged in) while the primary leads. It never logs in
  # without the Redis lock, even if Redis is down.
  robtic-system-standby:
    <<: *robtic-system-gateway
    container_name: robtic-system-standby
    environment:
      <<: *robtic-system-gateway-env
      GATEWAY_ROLE: standby

  # Queue workers (apps/worker): consume BullMQ queues, write MongoDB, award staff points. Two
  # separate services rather than replicas, so each has a fixed name; a dead worker's jobs are
  # picked up by the other once their locks expire (30s).
  robtic-system-worker-1:
    <<: *robtic-system-worker
    container_name: robtic-system-worker-1

  robtic-system-worker-2:
    <<: *robtic-system-worker
    container_name: robtic-system-worker-2

  # Invites internal API (internal-api/invites) for the Gateway. `internal` only.
  robtic-invites-api:
    <<: *vault
    image: ghcr.io/robticorg/robtic-system:${ROBTIC_SYSTEM_IMAGE_TAG:-production}
    container_name: robtic-invites-api
    command: ["bun", "--preload", "./libs/shared/src/preload.ts", "internal-api/invites/src/index.ts"]
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *robtic-system-env
      INVITES_API_PORT: "3005"
    networks: [internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Minecraft API (robtic-minecraft: apps/minecraft-api), public as minecraft.api.robtic.org.
  # Game servers on other hosts call it, so it joins `proxy`; Nginx Proxy Manager forwards to
  # http://robtic-minecraft-api:3002. Also runs the Minecraft Discord bot (token stored encrypted
  # in MongoDB, enabled with /bot create), so it counts as a bot during cutover.
  robtic-minecraft-api:
    <<: *vault
    image: ghcr.io/robticorg/robtic-minecraft-api:${MINECRAFT_API_IMAGE_TAG:-production}
    container_name: robtic-minecraft-api
    command: ["bun", "--preload", "./libs/shared/src/preload.ts", "apps/minecraft-api/src/index.ts"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # The Vault (robtic-minecraft): MONGODB_URI, MainBotToken (Discord REST only: role sync, logs; it never logs in),
    # BOT_OWNER_ID, MINECRAFT_BOT_SECRET, BOT_TOKEN_KEY, ROBTIC_WEBSITE_URL, ROBTIC_DISCORD_INVITE, MINECRAFT_API_PUBLIC_URL.
    environment:
      NODE_ENV: production
      ROBTIC_VAULT_KEY: ${ROBTIC_MINECRAFT_VAULT_KEY:?ROBTIC_MINECRAFT_VAULT_KEY is required (admin.robtic.org → Vault → robtic-minecraft)}
      MINECRAFT_API_HOST: 0.0.0.0
      MINECRAFT_API_PORT: "3002"
    ports:
      - "3002:3002"
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Staff bot (robtic-staff). Its points API (:8788) is called only by robtic-system and the
  # workers, so it stays on `internal`.
  robtic-staff:
    <<: *vault
    image: ghcr.io/robticorg/robtic-staff:${STAFF_IMAGE_TAG:-production}
    container_name: robtic-staff
    command: ["bun", "--preload", "./src/remote-config.ts", "src/index.ts"]
    restart: unless-stopped
    # Shutdown destroys the gateway client and closes Mongo — more than the 10s default.
    stop_grace_period: 30s
    logging: *logging
    # The Vault (robtic-staff): MONGODB_URI, MONGODB_DB, STAFF_TIMEZONE, LOG_LEVEL, DISCORD_APP_ID, DISCORD_GUILD_ID,
    # DISCORD_DEV_GUILD_ID, PREFIX, FAST_ACCESS_PREFIX, MODMAIL_CASE_PREFIX, BOT_OWNER_ID, INTERNAL_API_TOKEN and the
    # admin console's bot-settings database. The app reads several with `??`, where an empty string is a value: an
    # empty STAFF_TIMEZONE fails startup.
    environment:
      NODE_ENV: production
      ROBTIC_BOT: staff
      ROBTIC_VAULT_KEY: ${ROBTIC_STAFF_VAULT_KEY:?ROBTIC_STAFF_VAULT_KEY is required (admin.robtic.org → Vault → robtic-staff)}
      INTERNAL_API_HOST: 0.0.0.0
      INTERNAL_API_PORT: "8788"
      # Robtic Bot Log (robticorg/robtic-bot-log): joins/leaves; the key is ROBTIC_BOT_LOG_KEY in this bot's Vault app.
      ROBTIC_BOT_LOG_URL: http://robtic-bot-log:3400
    ports:
      - "8788:8788"
    networks: [internal]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8788/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Ticket bot (robticorg/robtic-monorepo → ghcr.io/robticorg/robtic-ticket). Everything it needs (token, client id,
  # its database, TRANSCRIPT_BASE_URL) is set in the admin console (Discord → Bot settings → Robtic Ticket); until a
  # token is saved there it waits quietly. Values here are only defaults the console overrides.
  robtic-ticket:
    <<: *vault
    image: ghcr.io/robticorg/robtic-ticket:${TICKET_IMAGE_TAG:-production}
    container_name: robtic-ticket
    command: ["bun", "apps/bot/src/bot.ts"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # The Vault (robtic-ticket): R2 for transcript pictures, TRANSCRIPT_BASE_URL, STAFF_POINTS_API_TOKEN and the admin
    # console's bot-settings database.
    environment:
      NODE_ENV: production
      ROBTIC_BOT: ticket
      ROBTIC_VAULT_KEY: ${ROBTIC_TICKET_VAULT_KEY:?ROBTIC_TICKET_VAULT_KEY is required (admin.robtic.org → Vault → robtic-ticket)}
      # Robtic Staff link: points for claimed tickets (Robtic Ticket → Settings → Robtic Staff), as robtic-system does.
      STAFF_POINTS_API_URL: http://robtic-staff:8788/internal/staff/points
    networks: [internal]

  # The ticket transcript page and its API (same image), public as robtic.org/discord/transcripts/<id>: Nginx Proxy
  # Manager forwards that path, unchanged, to http://robtic-ticket-transcripts:5180. Reads the ticket bot's database.
  robtic-ticket-transcripts:
    <<: *vault
    image: ghcr.io/robticorg/robtic-ticket:${TICKET_IMAGE_TAG:-production}
    container_name: robtic-ticket-transcripts
    command: ["bun", "apps/transcript/server.ts"]
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      ROBTIC_BOT: ticket
      ROBTIC_LOG_SOURCE: transcripts
      ROBTIC_VAULT_KEY: ${ROBTIC_TICKET_VAULT_KEY:?ROBTIC_TICKET_VAULT_KEY is required (admin.robtic.org → Vault → robtic-ticket)}
      TRANSCRIPT_PORT: "5180"
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:5180/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Robtic Engine (robticorg/robtic-engine, Rust): AutoMod. Its own Discord connection with the System bot's token
  # (read from the admin console like the bot), so protection keeps running while robtic-system restarts. Reads
  # what the dashboard saved (guildfeatures automod, automodsettings, template versions); acts only on servers that
  # turned AutoMod on. Warn / mute / jail go to Redis `robtic:automod:moderation`, recorded by robtic-system.
  # Internal API (/health, /validate) on :8790 inside `internal` only — nothing published.
  robtic-engine:
    image: ghcr.io/robticorg/robtic-engine:${ENGINE_IMAGE_TAG:-production}
    container_name: robtic-engine
    entrypoint: ["/vault/vault-run", "robtic-engine"]
    volumes:
      - /opt/robtic/vault/vault-run:/vault/vault-run:ro
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    # The Vault (robtic-engine): ENGINE_MONGODB_URI, ENGINE_REDIS_URL, ENGINE_INTERNAL_TOKEN, ENGINE_DRY_RUN (1 = only
    # log what it would do), ENGINE_PLUGINS (off | dry | on; Documents/plugins.md §5a), RUST_LOG and the admin
    # console's bot-settings database.
    environment:
      ROBTIC_VAULT_KEY: ${ROBTIC_ENGINE_VAULT_KEY:?ROBTIC_ENGINE_VAULT_KEY is required (admin.robtic.org → Vault → robtic-engine)}
    networks: [internal]

  # Scam guard bot (robticorg/robtic-guard-). MongoDB only (database `scamguard`). The app reads its
  # tuning with `??`, so an empty value would become 0: every default here is the production value.
  robtic-guard:
    <<: *vault
    image: ghcr.io/robticorg/robtic-guard:${GUARD_IMAGE_TAG:-production}
    container_name: robtic-guard
    command: ["bun", "--preload", "./src/preload.ts", "src/index.ts"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # The Vault (robtic-guard): TOKEN, MONGODB_URI, RoBo (the owner's id), the RISK_* thresholds, image and OCR limits,
    # HASH_CACHE_TTL_MS, FUZZY_HASH_MAX_DISTANCE, DETECTION_MAX_CONCURRENCY and API_ENABLED (0 disables the public
    # HTTP API). The app reads its tuning with `??`, so an empty value would become 0: keep every one set there.
    environment:
      NODE_ENV: production
      ROBTIC_VAULT_KEY: ${ROBTIC_GUARD_VAULT_KEY:?ROBTIC_GUARD_VAULT_KEY is required (admin.robtic.org → Vault → robtic-guard)}
      API_PORT: "8787"
      # Robtic Bot Log (robticorg/robtic-bot-log): joins/leaves; the key is ROBTIC_BOT_LOG_KEY in this bot's Vault app.
      ROBTIC_BOT_LOG_URL: http://robtic-bot-log:3400
    ports:
      - "8787:8787"
    networks: [internal]

  # Robtic Bot Log (robticorg/robtic-bot-log): one log channel for every Robtic bot. The bots send joins and leaves
  # over `internal` (POST /internal/events, ROBTIC_BOT_LOG_KEY); Discord's Webhook Events (who added a bot) reach
  # POST /discord/events/<bot> through Nginx Proxy Manager — the only path forwarded there, hence `proxy`.
  # The Vault (robtic-bot-log): BOT_LOG_KEY, LOG_WEBHOOK_URL, optional LOG_WEBHOOK_URL_<BOT>, LOG_EVENTS, and per app
  # APP_<BOT>_PUBLIC_KEY / APP_<BOT>_ID / APP_<BOT>_NAME. Without its key it restarts until one is set; the bots carry on.
  robtic-bot-log:
    <<: *vault
    image: ghcr.io/robticorg/robtic-bot-log:${BOT_LOG_IMAGE_TAG:-production}
    container_name: robtic-bot-log
    command: ["bun", "apps/service/src/server.ts"]
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    environment:
      NODE_ENV: production
      ROBTIC_VAULT_KEY: ${ROBTIC_BOT_LOG_VAULT_KEY:-}
      PORT: "3400"
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3400/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
    name: robtic-bots-internal
    driver: bridge
  default:
    name: robtic-bots-default
  proxy:
    external: true
