# Developer stack. Paths resolve from this file, hence ../../.. for the repository root.
#   bun run docker:local -- up --build

name: robtic-local

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/bot.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      # Overrides .env: inside the network the database is a service name.
      MONGODB_URI: mongodb://mongo:27017/robtic
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Logs are written relative to cwd.
      - ../../../logs:/app/logs

  # Opt-in: bun run docker:local -- --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
