# Developer stack. Paths resolve from this file, hence ../../.. for the repository root.
#   bun run docker:local -- up --build

name: robtic-local

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/bot.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      # Overrides .env: inside the network the database is a service name.
      MONGODB_URI: mongodb://mongo:27017/robtic
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Logs are written relative to cwd.
      - ../../../logs:/app/logs

  minecraft-api:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/minecraft-api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/robtic
      MINECRAFT_API_PORT: 3002
      NODE_ENV: development
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  minecraft:
    build:
      # dockerfile is relative to context, which is why the two climb by different amounts.
      context: ../../../apps/minecraft-plugin
      dockerfile: ../../infra/docker/dockerfiles/minecraft-plugin.Dockerfile
      target: server
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    environment:
      # Set MINECRAFT_EULA=TRUE in .env to accept Mojang's EULA.
      EULA: ${MINECRAFT_EULA:-FALSE}
    depends_on:
      - minecraft-api
    volumes:
      - minecraft-data:/data
      # The plugin is configured through plugins/RobticMinecraft/api.yml, not env vars.
      - ../../../apps/minecraft-plugin/local-config:/config-seed:ro

  # Opt-in: bun run docker:local -- --profile tools up -d
  mongo-express:
    image: mongo-express:1.0.2
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  minecraft-data:
