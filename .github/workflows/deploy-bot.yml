name: Deploy bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even when nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-compose
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robticorg/robtic-system

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      signature: ${{ steps.decision.outputs.signature }}
    steps:
      - uses: actions/checkout@v4

      - id: decision
        uses: ./.github/actions/deploy-decision
        with:
          service: bot
          force: ${{ inputs.force || false }}

  # `:production` is what the robtic-bots stack runs; `:sha-<commit>` never moves, so a rollback is
  # the Portainer variable ROBTIC_SYSTEM_IMAGE_TAG=sha-<commit>.
  image:
    name: Build & push image
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/dockerfiles/bot.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=robtic-system
          cache-to: type=gha,mode=max,scope=robtic-system

  # Portainer re-pulls `:production` and recreates only the containers whose image changed. The
  # Gateway that comes up leading publishes the slash commands as it starts (the job that used to
  # `docker compose exec` register-commands.ts needed a runner on the server).
  redeploy:
    name: Redeploy robtic-bots
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.ROBTIC_BOTS_PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::ROBTIC_BOTS_PORTAINER_WEBHOOK_URL is not set — image pushed, nothing redeployed."
            exit 0
          fi
          curl --fail-with-body -sS -X POST --max-time 300 "$WEBHOOK"

  notify:
    name: Deploy notification
    needs: [image, redeploy]
    if: ${{ always() && needs.image.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          RESULT: ${{ needs.redeploy.result == 'success' && 'success' || 'failure' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_DEPLOY is not set — skipping."; exit 0; }
          PAYLOAD=$(jq -n --arg repo "$REPO" --arg sha "${SHA:0:7}" --arg result "$RESULT" --arg url "$RUN_URL" \
            '{username: "Robtic Deploy", embeds: [{title: "\($repo) → robtic-bots: \($result)", url: $url,
              description: "Image `sha-\($sha)` · stack webhook called", color: (if $result == "success" then 3066993 else 15158332 end)}]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

  seal:
    name: Record what was deployed
    needs: [changes, redeploy]
    if: ${{ needs.redeploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: |
          mkdir -p .deploy-signatures
          printf '%s %s %s\n' "${{ github.sha }}" \
            "$(date -u +%FT%TZ)" "${{ github.run_id }}" > .deploy-signatures/bot

      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .deploy-signatures/bot
          key: deploy-v1-bot-${{ needs.changes.outputs.signature }}
